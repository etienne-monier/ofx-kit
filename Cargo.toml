[workspace]
resolver = "3"
members = ["crates/ofx-kit", "crates/ofx-cli"]
default-members = ["crates/ofx-kit", "crates/ofx-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Etienne Monier <etienne.monier@protonmail.com>"]
repository = "https://github.com/etienne-monier/ofx-kit"
homepage = "https://github.com/etienne-monier/ofx-kit"
