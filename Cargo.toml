[package]
name = "ofx-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "A Rust library for parsing Open Financial Exchange (OFX) documents"
license = "MIT"
authors = ["Etienne Monier <etienne.monier@protonmail.com>"]
repository = "https://github.com/etienne-monier/ofx-kit"
homepage = "https://github.com/etienne-monier/ofx-kit"
documentation = "https://docs.rs/ofx-rs"
readme = "README.md"
# The OFX specification PDFs are third-party copyrighted documents and are
# not covered by this crate's MIT license, so are kept out of published packages.
exclude = ["spec/"]
keywords = ["ofx", "finance", "banking", "parser", "sgml"]
categories = ["finance", "parser-implementations"]

[dependencies]
quick-xml = "0.41.0"
rust_decimal = "1.40.0"
time = "0.3.47"

[dev-dependencies]
proptest = "1.10.0"
